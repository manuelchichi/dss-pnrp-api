services:
  fastapi:
    ports:
      - "8000:80"
    restart: on-failure
    networks:
      - default
      - redmine
    environment:
      - MONGODB_URL=mongodb://mongo/api?retryWrites=true&w=majority
  mongo:
    image: "mongo:8.2" 
    environment:
      - MONGO_INITDB_DATABASE=api
    volumes:
      - mongo-data:/bitnami/mongodb
    restart: on-failure
    networks:
      - default

networks:
  redmine:
    external: true
    name: dss-pnrp-redmine-plugin_default

volumes:
  mongo-data:
